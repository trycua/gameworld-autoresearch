[project]
name = "fps-bench"
version = "0.1.0"
description = "GameWorld joint autoresearch built from the FPS-bench Fleet loop"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cua-bench[browser]==0.2.11",
    "cua-sandbox>=0.4.3",
    "anthropic>=0.60.0",
]

[project.optional-dependencies]
baseline = ["pillow==11.3.0"]
infra = ["modal==1.5.5"]
training = ["torch==2.9.0", "torchvision==0.24.0", "transformers==4.57.1", "peft==0.17.1", "accelerate==1.10.1", "pillow==11.3.0"]
telemetry = ["opentelemetry-proto==1.37.0", "protobuf==6.33.6"]

[tool.uv]
extra-index-url = ["https://wheels.cua.ai/simple"]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fps_bench"]
