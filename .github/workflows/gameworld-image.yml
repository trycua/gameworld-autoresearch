name: GameWorld Fleet environment image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gameworld-image.yml
      - .dockerignore
      - image/**
      - cua-driver/**
      - fps_bench/**
      - bench/**
      - tasks/**
      - configs/**
      - scripts/gameworld_baseline_check.py
      - scripts/gameworld_driver_contract.py
      - scripts/gameworld_driver_worker.py
      - scripts/gameworld_image_check.py
      - scripts/gameworld_rollout_worker.py
      - .auto/gameworld-prompt.md
      - .auto/measure_gameworld.sh
      - docs/GAMEWORLD_FLEET.md
      - README.md
      - pyproject.toml

permissions:
  contents: read
  packages: write

concurrency:
  group: gameworld-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check baseline protocol
        run: |
          python3 scripts/gameworld_baseline_check.py
          python3 scripts/gameworld_image_check.py
      - name: Choose image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:gameworld-sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the native driver and desktop image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: image/Dockerfile.gameworld
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=gameworld-fleet-worker
          cache-to: type=gha,mode=max,scope=gameworld-fleet-worker
      - name: Verify baked artifacts support fast offline rebuilds
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          docker run --rm --network none --entrypoint /bin/bash "$IMAGE" -c '
            set -euo pipefail
            cd "$CUA_DRIVER_SRC/rust"
            SECONDS=0
            CARGO_LOG=cargo::core::compiler::fingerprint=info cargo build --offline --locked --release -p cua-driver 2>&1 | tee /tmp/rebuild.log
            echo "Fresh-container warm rebuild seconds: $SECONDS"
            test "$SECONDS" -lt 60
            if grep "Compiling " /tmp/rebuild.log | grep -v "(/opt/gameworld-autoresearch/cua-driver/rust/"; then
              echo "Baked third-party dependencies were not reused" >&2
              exit 1
            fi
            bash /opt/gameworld-autoresearch/image/rebuild_driver.sh
            printf "\n" >> crates/cua-driver/src/main.rs
            SECONDS=0
            cargo build --offline --locked --release -p cua-driver 2>&1 | tee /tmp/patched-rebuild.log
            echo "Source-edit rebuild seconds: $SECONDS"
            if grep "Compiling " /tmp/patched-rebuild.log | grep -v "Compiling cua-driver v"; then
              echo "A source-only edit unexpectedly recompiled dependencies" >&2
              exit 1
            fi
          '
      - name: Smoke-test the desktop before publishing
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          docker run -d --name gameworld-worker-smoke --shm-size=512m "$IMAGE"
          for attempt in $(seq 1 3); do
            if docker exec gameworld-worker-smoke /opt/gameworld-venv/bin/python image/smoke_gameworld.py; then
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 gameworld-worker-smoke
          exit 1
      - name: Publish the tested image
        id: publish
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          docker push "$IMAGE_TAG"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "$IMAGE_TAG" "$IMAGE_NAME:gameworld"
            docker push "$IMAGE_NAME:gameworld"
          fi
          IMAGE_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")
          export IMAGE_REF
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('fleet-image.json').write_text(json.dumps({
              'image': os.environ['IMAGE_REF'], 'runtime': 'gvisor',
              'source_revision': os.environ['GITHUB_SHA'],
              'min_pool_size': 0, 'max_pool_size': 20,
          }, indent=2) + '\n')
          PY
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "### Published Fleet image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Fleet requires anonymous pull access. On first publication, set this container package to public in its GitHub package settings.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gameworld-fleet-image-${{ github.sha }}
          path: fleet-image.json
          retention-days: 30
      - name: Clean up smoke container
        if: always()
        run: docker rm -f gameworld-worker-smoke || true
